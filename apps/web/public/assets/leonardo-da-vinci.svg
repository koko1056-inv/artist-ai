<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Geometry, gear and compass motif">
  <defs>
    <linearGradient id="dvg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a6a3a"/>
      <stop offset="1" stop-color="#5a4222"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#dvg)"/>
  <!-- parchment grid -->
  <g stroke="#e8d8b0" stroke-width="1" opacity="0.18">
    <line x1="0" y1="60" x2="400" y2="60"/><line x1="0" y1="120" x2="400" y2="120"/>
    <line x1="0" y1="180" x2="400" y2="180"/><line x1="0" y1="240" x2="400" y2="240"/>
    <line x1="80" y1="0" x2="80" y2="300"/><line x1="160" y1="0" x2="160" y2="300"/>
    <line x1="240" y1="0" x2="240" y2="300"/><line x1="320" y1="0" x2="320" y2="300"/>
  </g>
  <!-- vitruvian-style geometry (original) -->
  <g transform="translate(140,150)" stroke="#f0e3c4" stroke-width="4" fill="none">
    <rect x="-60" y="-60" width="120" height="120"/>
    <circle r="68"/>
  </g>
  <!-- gear -->
  <g transform="translate(290,200)" fill="#f0e3c4">
    <g>
      <rect x="-8" y="-48" width="16" height="96"/>
      <rect x="-8" y="-48" width="16" height="96" transform="rotate(45)"/>
      <rect x="-8" y="-48" width="16" height="96" transform="rotate(90)"/>
      <rect x="-8" y="-48" width="16" height="96" transform="rotate(135)"/>
    </g>
    <circle r="34"/>
    <circle r="14" fill="#5a4222"/>
  </g>
  <!-- compass -->
  <g transform="translate(300,70)" stroke="#f0e3c4" stroke-width="6" fill="none" stroke-linecap="round">
    <circle cx="0" cy="-20" r="7" fill="#f0e3c4" stroke="none"/>
    <line x1="0" y1="-16" x2="-22" y2="40"/>
    <line x1="0" y1="-16" x2="22" y2="40"/>
  </g>
</svg>
