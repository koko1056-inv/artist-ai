<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Atom and equation motif">
  <defs>
    <linearGradient id="aeg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b3470"/>
      <stop offset="1" stop-color="#211c45"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#aeg)"/>
  <!-- atom -->
  <g transform="translate(150,150)">
    <g fill="none" stroke="#c8ccff" stroke-width="4">
      <ellipse rx="78" ry="30"/>
      <ellipse rx="78" ry="30" transform="rotate(60)"/>
      <ellipse rx="78" ry="30" transform="rotate(120)"/>
    </g>
    <circle r="13" fill="#ffd56b"/>
    <circle cx="78" cy="0" r="7" fill="#c8ccff"/>
    <circle cx="-39" cy="67" r="7" fill="#c8ccff"/>
    <circle cx="-39" cy="-67" r="7" fill="#c8ccff"/>
  </g>
  <!-- chalkboard equation -->
  <g transform="translate(270,210)">
    <rect x="-40" y="-30" width="120" height="60" rx="6" fill="#1b2a22"/>
    <text x="20" y="10" font-family="Georgia, serif" font-size="30" fill="#eef" text-anchor="middle">E=mc²</text>
  </g>
</svg>
