<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Emerald city, tornado and yellow road motif">
  <defs>
    <linearGradient id="ozg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d6b4f"/>
      <stop offset="1" stop-color="#0e3527"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#ozg)"/>
  <!-- tornado -->
  <g transform="translate(95,30)" fill="#bfcfc7" opacity="0.6">
    <path d="M0 0 q70 6 70 18 q0 12 -56 16 q44 6 44 18 q0 12 -40 14 q30 6 30 16 q0 10 -24 12
             q18 6 18 14 q0 10 -16 10 l-8 130 z"/>
  </g>
  <!-- emerald city -->
  <g transform="translate(250,120)" fill="#3fcf8f">
    <rect x="-10" y="40" width="20" height="100"/>
    <rect x="-40" y="70" width="22" height="70"/>
    <rect x="18" y="64" width="22" height="76"/>
    <rect x="-66" y="92" width="18" height="48"/>
    <rect x="48" y="88" width="18" height="52"/>
    <polygon points="0,40 -12,10 12,10"/>
    <polygon points="-29,70 -39,46 -19,46"/>
    <polygon points="29,64 19,40 39,40"/>
  </g>
  <g transform="translate(250,120)" fill="#bfe9d4">
    <rect x="-5" y="60" width="10" height="14"/><rect x="-5" y="92" width="10" height="14"/>
  </g>
  <!-- yellow brick road -->
  <path d="M40 280 Q150 240 250 250 L400 250 L400 300 L20 300 Z" fill="#e7c34a"/>
  <g stroke="#0e3527" stroke-width="3" opacity="0.4">
    <line x1="90" y1="262" x2="110" y2="258"/>
    <line x1="160" y1="252" x2="180" y2="250"/>
    <line x1="240" y1="252" x2="260" y2="252"/>
  </g>
</svg>
