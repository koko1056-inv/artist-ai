<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Steamboat motif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#27496d"/>
      <stop offset="1" stop-color="#142b45"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <!-- moon -->
  <circle cx="320" cy="70" r="34" fill="#f4e9d0" opacity="0.9"/>
  <!-- steam puffs from whistle -->
  <g fill="#f4e9d0" opacity="0.85">
    <circle cx="150" cy="78" r="10"/>
    <circle cx="166" cy="64" r="13"/>
    <circle cx="188" cy="56" r="16"/>
  </g>
  <!-- boat hull -->
  <path d="M70 215 h220 l-26 34 H96 Z" fill="#e8d9b5"/>
  <!-- cabin -->
  <rect x="120" y="150" width="120" height="65" rx="6" fill="#cfe0ef"/>
  <!-- smokestacks -->
  <rect x="140" y="108" width="20" height="46" rx="4" fill="#1c3a5e"/>
  <rect x="180" y="100" width="20" height="54" rx="4" fill="#1c3a5e"/>
  <!-- whistle pipe -->
  <rect x="146" y="92" width="8" height="22" rx="3" fill="#9bb4cc"/>
  <!-- portholes -->
  <circle cx="150" cy="182" r="9" fill="#27496d"/>
  <circle cx="185" cy="182" r="9" fill="#27496d"/>
  <circle cx="220" cy="182" r="9" fill="#27496d"/>
  <!-- water -->
  <g stroke="#9bb4cc" stroke-width="4" fill="none" opacity="0.8" stroke-linecap="round">
    <path d="M40 262 q20 -14 40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0"/>
    <path d="M60 278 q20 -14 40 0 t40 0 t40 0 t40 0 t40 0 t40 0"/>
  </g>
</svg>
